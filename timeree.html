<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Engine</title>
    <style>
        video {
            width: 100%;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Exam Engine</h1>
    <video id="localVideo" autoplay muted></video>

    <script>
        const websocket = new WebSocket("ws://localhost:8765");
        const peerConnections = {};
        const constraints = { audio: true, video: true };

        async function startExam() {
            try {
                const localStream = await navigator.mediaDevices.getUserMedia(constraints);
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;

                websocket.onopen = () => {
                    websocket.send(JSON.stringify({ type: 'new_connection', role: 'candidate', peer_id: 'candidate1' }));
                };

                websocket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    console.log("Received message:", data);

                    if (!peerConnections[data.sender]) {
                        setupPeerConnection(data.sender, localStream);
                    }

                    const pc = peerConnections[data.sender];
                    if (data.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.message));
                    } else if (data.type === 'candidate') {
                        await pc.addIceCandidate(new RTCIceCandidate(data.message));
                    }
                };

                // Send offer to Proctor
                const pc = setupPeerConnection('proctor1', localStream);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                websocket.send(JSON.stringify({ type: 'offer', recipient: 'proctor1', message: pc.localDescription }));

            } catch (error) {
                console.error('Error accessing media devices:', error);
            }
        }

        function setupPeerConnection(remoteId, localStream) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]  // STUN server
            });
            peerConnections[remoteId] = pc;

            localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({ type: 'candidate', recipient: remoteId, message: event.candidate }));
                }
            };

            return pc;
        }

        startExam();
    </script>
</body>
</html>
