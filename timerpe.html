<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctoring Engine</title>
    <style>
        video {
            width: 45%;
            margin: 2%;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Proctoring Engine</h1>
    <div id="videos"></div>
    <video id="localVideo" autoplay muted></video> <!-- Local video element -->

    <script>
        const websocket = new WebSocket("ws://localhost:8765");
        const peerConnections = {};
        const localVideo = document.getElementById('localVideo');
        const constraints = { audio: true, video: true };
        let localStream;

        // Start capturing the local video stream
        async function startLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;

                // Send local stream to the Exam Engine if needed
                // Uncomment the following line if you want to send the local stream to the Exam Engine
                // sendLocalStreamToExamEngine();

            } catch (error) {
                console.error('Error accessing media devices:', error);
            }
        }

        websocket.onopen = () => {
            websocket.send(JSON.stringify({ type: 'new_connection', role: 'proctor', peer_id: 'proctor1' }));
        };

        websocket.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            console.log("Received message:", data);

            if (!peerConnections[data.sender]) {
                setupPeerConnection(data.sender);
            }

            const pc = peerConnections[data.sender];
            if (data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.message));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                websocket.send(JSON.stringify({ type: 'answer', recipient: data.sender, message: pc.localDescription }));
            } else if (data.type === 'candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data.message));
            }
        };

        function setupPeerConnection(remoteId) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]  // STUN server
            });
            peerConnections[remoteId] = pc;

            // Add local stream tracks to the peer connection
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                const remoteVideo = document.createElement('video');
                remoteVideo.autoplay = true;
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('videos').appendChild(remoteVideo);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({ type: 'candidate', recipient: remoteId, message: event.candidate }));
                }
            };
        }

        // Start the local video stream when the page loads
        startLocalStream();
    </script>
</body>
</html>
